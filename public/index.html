<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BALANCE 5 · 말잘러 삼장법사의 생존논리</title>
<meta name="description" content="AI가 대신 못 하는 것, 30초 만에 내 생각을 내 말로 증명하는 삼지작법 말하기 연습">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== 말로 증명하라 — design tokens =====
   Paper & ink with two working colors: indigo = 짜기(구성), pine = 재기(측정). Ember only marks the weak spot.
   Display type: Hahmlet (statements, titles, score numerals). Body: IBM Plex Sans KR. */
:root{
  --paper:#F4F5F0; --surface:#FFFFFF; --ink:#1B2620; --ink2:#4A5650; --ink3:#69736D;
  --rule:#E1E5DD; --rule2:#CDD3CA;
  --pine:#1D6A47; --pine-d:#14503A; --pine-soft:#E2F0E7; --pine-tint:#F1F7F3;
  --indigo:#3A4B98; --indigo-d:#2B3976; --indigo-soft:#E9ECF8; --indigo-tint:#F5F6FC;
  --ember:#BF4519; --ember-soft:#FBECE4; --hi:#FFE3B3;
  /* 종인유 고유색 (모든 화면·카드·이미지 공통): 宗 빨강 · 因 파랑 · 喩 초록 */
  --jong:#C62828; --jong-soft:#FDECEC; --in:#1565C0; --in-soft:#E8F0FB; --yu:#2E7D32; --yu-soft:#E8F5E9;
  /* legacy aliases used by older markup */
  --bg:var(--paper); --card:var(--surface); --muted:var(--ink2); --faint:var(--ink3); --line:var(--rule); --line2:var(--rule2);
  --green:var(--pine); --green-d:var(--pine-d); --green-soft:var(--pine-soft); --green-tint:var(--pine-tint);
  --orange:var(--ember); --orange-soft:var(--ember-soft); --seg:#E3E7E0; --amber:var(--hi);
  --form:var(--indigo); --form-d:var(--indigo-d); --form-soft:var(--indigo-soft); --form-tint:var(--indigo-tint); --form-line:#CDD3EE;
  --serif:'Hahmlet','IBM Plex Sans KR',serif; --sans:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.wrap{max-width:calc(520px / var(--z, 1));margin:0 auto;min-height:100vh;padding:0 20px 120px}
:focus-visible{outline:3px solid var(--pine);outline-offset:2px;border-radius:8px}

/* header: app name + who I am */
header.top{position:sticky;top:0;z-index:20;margin:0 -20px;padding:14px 20px 12px;background:rgba(244,245,240,.94);backdrop-filter:blur(10px);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid transparent}
.iconbtn.backbtn{width:auto;padding:0 12px 0 8px;gap:2px;font-size:14px;font-weight:700;display:inline-flex;align-items:center}.iconbtn.backbtn[hidden]{display:none}
@media (max-width:600px){.iconbtn.backbtn{width:40px;padding:0;justify-content:center}.iconbtn.backbtn span{display:none}}
.si-checks{margin-top:14px;padding:12px 14px;border:1px solid var(--rule2);border-radius:12px;background:var(--surface)}.si-checks p{margin:0 0 6px;font-size:14px}.si-checks ol{margin:0;padding-left:20px;font-size:14px;line-height:1.7}
.dprog{display:flex;align-items:center;justify-content:center;margin:18px 0 4px;padding-top:14px;border-top:1px solid var(--rule2,#DDD8CC)}.dprog i{flex:0 1 18px;height:2px;background:var(--rule2,#DDD8CC)}
.dprog button{width:34px;height:34px;flex:0 0 34px;border-radius:50%;border:2px solid var(--rule2,#DDD8CC);background:var(--surface,#fff);font-weight:700;font-size:15px;color:var(--muted,#7A7466);cursor:pointer;padding:0}
.dprog button.done{background:var(--fc,#3D4B6E);border-color:var(--fc,#3D4B6E);color:#fff}
.dprog button.cur{border-color:var(--fc,#3D4B6E);color:var(--fc,#3D4B6E);box-shadow:0 0 0 3px color-mix(in srgb,var(--fc,#3D4B6E) 22%,transparent)}
.dprog button.cur.done{color:#fff}
.dprog button.part{border-style:dashed;border-color:var(--fc,#3D4B6E);color:var(--fc,#3D4B6E);background:color-mix(in srgb,var(--fc,#3D4B6E) 10%,#fff)}
.dhint{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:#FFF8E6;border:1px solid #F1DFAE}.dhint p{margin:0 0 6px;font-size:14.5px;line-height:1.6}.dhint .link{padding:2px 0;font-weight:700}
header.top.scrolled{border-bottom-color:var(--rule)}
.brand{font-family:var(--serif);font-weight:700;font-size:21px;letter-spacing:-.5px;text-decoration:none;color:var(--ink);line-height:1.2}
.who-line{display:flex;align-items:center;gap:6px;margin-top:3px;border:none;background:none;padding:0;font-size:13.5px;color:var(--pine-d);font-weight:600;text-align:left}
.who-line.need{color:var(--ember)}
.caret{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);margin-left:2px}
.iconbtn{flex:none;border:1px solid var(--rule2);background:var(--surface);border-radius:12px;width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2)}

/* type */
h1,h2{letter-spacing:-.4px}
h1.ph{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.25;margin:22px 0 6px}
h2{font-size:18px;margin:0 0 10px}
h2.sec{font-size:15px;color:var(--ink2);margin:30px 0 10px;font-weight:600}
.sub{color:var(--ink2);font-size:15px;margin:0 0 20px;max-width:34em}
.display{font-family:var(--serif);font-weight:700;font-size:clamp(30px,8.6vw,38px);line-height:1.22;letter-spacing:-1.2px;margin:0}
.body-tx{margin:0;color:var(--ink2);font-size:15px;line-height:1.7}.body-tx b{color:var(--ink)}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}.small{font-size:13.5px}.tiny{font-size:12px}
.cf{color:var(--indigo)}.cs{color:var(--pine)}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb0{margin-bottom:0}
.row{display:flex;gap:8px;align-items:center}.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.note{font-size:12.5px;color:var(--ink3);margin-top:12px}

/* buttons */
.btn{border:none;border-radius:999px;min-height:52px;padding:0 22px;font-size:16px;font-weight:600;background:var(--pine);color:#fff;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.btn:hover{background:var(--pine-d)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule2)}
.clearbtn{display:inline-block;margin:4px auto 0;padding:10px 22px;border-radius:999px;background:#fff;color:var(--orange);border:1.5px solid var(--orange);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.clearbtn:hover{background:color-mix(in srgb,var(--orange) 7%,#fff)}
.btn.ghost:hover{background:var(--surface)}
.btn.soft{background:var(--pine-soft);color:var(--pine-d)}
.btn.small{min-height:42px;font-size:14px;width:auto;padding:0 16px}
.btn.danger{background:var(--ember)}
.btn.fcta{background:var(--indigo)}.btn.fcta:hover{background:var(--indigo-d)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.cta{min-height:58px;font-size:17px;box-shadow:0 10px 24px -10px rgba(29,106,71,.6)}
.link,.textbtn{background:none;border:none;color:var(--pine-d);font-weight:600;padding:6px 0;font-size:14px;text-decoration:none}
.textbtn.muted{color:var(--ink3)}
.textlink{display:block;text-align:center;margin:14px 0 0;font-size:14.5px;font-weight:600;color:var(--pine-d);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule2)}
.textlink.left{text-align:left;margin:0 0 16px}
.textlink.dlink{margin:-4px 0 14px;font-size:14px}
.intro-link{display:block;text-align:center;margin-top:8px}
.back{display:inline-block;margin:16px 0 0;color:var(--ink2);text-decoration:none;font-weight:600;font-size:14px}
.chip{border:1px solid var(--rule2);background:var(--surface);border-radius:12px;min-height:46px;padding:6px 8px;font-size:14px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--pine-soft);color:var(--pine-d)}
.pill.o{background:var(--ember-soft);color:var(--ember)}.pill.g{background:#ECEFEA;color:var(--ink2)}

/* home */
.hero{display:grid;grid-template-columns:1fr 92px;align-items:end;gap:8px;padding:26px 0 22px}
.hero-char{width:92px}
.ilist{background:var(--surface);border:1px solid var(--rule);border-radius:20px;overflow:hidden}
.irow + .irow{border-top:1px solid var(--rule)}
.irow-btn{width:100%;display:flex;align-items:center;gap:12px;border:none;background:none;min-height:60px;padding:0 16px;text-align:left}
.irow-btn.as-label{cursor:default;flex:1;min-width:0}
.tag{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:28px;padding:0 12px;border-radius:999px;background:var(--pine-soft);color:var(--pine-d);font-size:13px;font-weight:700}
.irow-t{flex:1;font-size:15.5px;font-weight:600;letter-spacing:-.2px}
.chev{width:9px;height:9px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(-45deg);transition:transform .2s;margin-right:4px}
.irow.open .chev{transform:rotate(45deg);border-color:var(--pine)}
.irow.open .tag{background:var(--pine);color:#fff}
.irow-body{padding:0 16px 18px 74px}
.irow.who{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 16px}
.irow.who .irow-btn.as-label{flex:none;width:auto;min-height:0;padding:0}
.irow.who .irow-t{display:none}
.irow.who .selwrap{flex:1}
.irow.who .who-select{width:100%;max-width:none}
.irow.who .tag{background:var(--ink);color:#fff}
.irow.who .irow-t{font-weight:500;color:var(--ink2);font-size:14px}
.irow.who.need{background:#FFF8EC}
.irow.who.need .irow-t{color:var(--ember);font-weight:600}
.selwrap{position:relative;flex:none}
.selwrap::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.who-select{appearance:none;-webkit-appearance:none;border:1px solid var(--rule2);background:var(--surface);border-radius:12px;height:42px;padding:0 34px 0 12px;font-size:14.5px;font-weight:600;max-width:200px}
.irow.who.need .who-select{border-color:var(--ember);box-shadow:0 0 0 3px rgba(191,69,25,.12)}
.flow3{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px;counter-reset:f}
.flow3 a{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:baseline;text-decoration:none;padding:8px 0;border-bottom:1px dashed var(--rule)}
.flow3 b{font-size:15px}.flow3 span{font-size:14px;color:var(--ink2)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs-item{border-radius:16px;padding:14px 12px}
.vs-item p{margin:8px 0;font-size:14px;line-height:1.5;font-weight:600}
.vs-item.bad{background:var(--ember-soft)}.vs-item.good{background:var(--pine-soft)}
.vs-score{font-family:var(--serif);font-size:32px;font-weight:700;letter-spacing:-1px;line-height:1}
.vs-score small{font-family:var(--sans);font-size:13px;color:var(--ink3);font-weight:600}
.vs-item.bad .vs-score,.vs-item.bad .vs-tag{color:var(--ember)}.vs-item.good .vs-score,.vs-item.good .vs-tag{color:var(--pine-d)}
.vs-tag{font-size:12.5px;font-weight:700}
.vs-note{margin:10px 0 0;font-size:12.5px;line-height:1.55;color:var(--ink3)}
.vs-full{margin-top:8px;border-radius:14px;background:#fff;border:1px solid var(--rule);padding:0 12px}
.vs-full summary{cursor:pointer;padding:11px 0;font-size:13.5px;font-weight:700;color:var(--pine-d)}
.vs-full ol{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}
.vs-full li{font-size:13.5px;line-height:1.5;border-left:3px solid var(--fc);padding-left:10px}
.vs-full li.hi{background:color-mix(in srgb,var(--fc) 9%,#fff);border-radius:0 8px 8px 0;padding:4px 8px 4px 10px}
.vs-full li b{display:block;font-size:12px;color:var(--fc-d,var(--fc))}
.motto{position:relative;z-index:1;margin:14px 0 0;font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.4;letter-spacing:-.3px;color:#8E1B1B}
.motto+.slogan{margin-top:8px}
.scope{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--paper);font-size:12.5px;line-height:1.55;color:var(--ink3)}
.fname{display:flex!important;flex-wrap:wrap;align-items:center;column-gap:6px;row-gap:4px}.fname>*{margin-left:0!important}
.fname .fl,.fname .fcode,.fname .ftime{white-space:nowrap}
.ftiles-sub{margin:14px 2px 6px;font-size:13px;font-weight:700;color:var(--ink3)}
.ask-f{color:var(--fc)}
.ftime{margin-left:6px;font-size:11.5px;font-weight:700;color:var(--ink3);background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:1px 7px;vertical-align:2px}
.cta-dock{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom));z-index:10;padding:14px 0 0;margin-top:22px;background:linear-gradient(to bottom,rgba(244,245,240,0),var(--paper) 35%)}
.free{text-align:center;font-size:13px;color:var(--ink3);margin:10px 0 0}

/* tabs */
.utabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-bottom:1px solid var(--rule);margin:0 0 20px}
.utabs button{border:none;background:none;padding:10px 4px 12px;text-align:left;border-bottom:3px solid transparent;margin-bottom:-1px;color:var(--ink3)}
.utabs button b{display:block;font-size:15px}.utabs button small{display:block;font-size:12px;line-height:1.35;margin-top:2px}
.utabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pine)}
.utabs.f button[aria-selected="true"]{border-bottom-color:var(--indigo)}.utabs.f button[aria-selected="true"] b{color:var(--indigo-d)}
.seg-tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:#E8EBE5;border-radius:999px;padding:4px;margin:4px 0 18px}
.seg-tabs button{border:none;background:none;border-radius:999px;min-height:40px;font-weight:600;font-size:14.5px;color:var(--ink2)}
.seg-tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* 짜기 explain */
.explain{margin-bottom:20px}
.explain .when{margin:0 0 6px;font-size:15px}.explain .when b{color:var(--indigo-d)}
.explain .why{margin:0 0 18px;font-size:15px;color:var(--ink2)}
.steps4{list-style:none;padding:0;margin:0;border-left:2px solid var(--indigo-soft);margin-left:15px}
.steps4 li{display:grid;grid-template-columns:32px 1fr;gap:12px;margin:0 0 20px -17px}
.steps4 .k{width:32px;height:32px;border-radius:50%;background:var(--indigo);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.steps4 b{font-size:16px;display:block;margin-top:3px}
.steps4 p{margin:4px 0 8px;font-size:14.5px;color:var(--ink2);line-height:1.65}
.steps4 q{display:block;quotes:none;background:var(--indigo-tint);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.55;color:var(--indigo-d)}
.mistake{margin:6px 0 0;padding:12px 14px;border-radius:12px;background:var(--ember-soft);font-size:14px;line-height:1.6}
.mistake b{color:var(--ember);margin-right:6px}

/* 말하기 choices */
.qbox{background:var(--surface);border:1px solid var(--rule);border-radius:20px;padding:16px 18px;margin-bottom:18px}
.qbox .who{font-size:12.5px;color:var(--ink3);font-weight:600}
.qbox .q{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.45;margin-top:4px;letter-spacing:-.3px}
.choices{display:grid;gap:10px}
.choice{background:var(--surface);border:1px solid var(--rule);border-radius:18px;overflow:hidden;scroll-margin-top:84px;transition:border-color .2s}
.choice.open{border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-soft)}
.choice-btn{width:100%;display:flex;gap:12px;align-items:flex-start;border:none;background:none;padding:16px;text-align:left}
.radio{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--rule2);margin-top:3px;position:relative}
.choice.open .radio{border-color:var(--indigo)}
.choice.open .radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--indigo)}
.choice-tx b{display:flex;align-items:center;gap:8px;font-size:16.5px}
.choice-tx span{display:block;font-size:13.5px;color:var(--ink2);margin-top:2px;line-height:1.5}
.reco{font-style:normal;font-size:11.5px;font-weight:700;color:var(--indigo-d);background:var(--indigo-soft);border-radius:999px;padding:2px 8px}
.choice-body{padding:0 16px 18px;animation:up .22s ease-out}
.direction{margin:0 0 14px;padding:10px 12px;border-radius:12px;background:var(--indigo-tint);font-size:14px;line-height:1.6;color:var(--indigo-d)}
.row-links{display:flex;justify-content:center;gap:20px;margin-top:8px}
.slot{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--rule)}
.slot:first-of-type{border-top:none}
.slot .k{width:34px;height:34px;border-radius:50%;background:var(--indigo-soft);color:var(--indigo-d);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.slot .t{font-weight:600;font-size:15px}
.slot .h{font-size:13px;color:var(--ink3)}
button.slot{width:100%;text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:12px;margin-bottom:8px}
.slot.ok{background:var(--pine-tint);border-color:#BFDCC9}.slot.ok .k{background:var(--pine);color:#fff}
.slot.bad{background:var(--ember-soft);border-color:#F0C7B5}.slot.bad .k{background:var(--ember);color:#fff}
.placed{font-size:14.5px;line-height:1.5}
textarea,input[type=text]{width:100%;border:1px solid var(--rule2);border-radius:12px;padding:10px 12px;background:#fff;line-height:1.55;font-size:15px}
textarea{resize:vertical;min-height:64px;margin-top:6px}
input[type=text]{min-height:46px}
textarea:focus,input:focus,select:focus{outline:2px solid var(--indigo);outline-offset:0;border-color:var(--indigo)}
.mic{border:1px solid var(--rule2);background:#fff;border-radius:999px;height:32px;padding:0 12px;font-size:12.5px;font-weight:600;color:var(--indigo-d);display:inline-flex;align-items:center;gap:6px}
.mic.rec{background:var(--ember);border-color:var(--ember);color:#fff}
.mic.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.est{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink3);margin:8px 0 14px}
.est .bar{flex:1;height:4px;border-radius:2px;background:var(--rule);overflow:hidden}
.est .bar i{display:block;height:100%;background:var(--indigo)}.est .bar i.over{background:var(--ember)}

/* 재기 list & result */
.mlist{list-style:none;padding:0;margin:0;background:var(--surface);border:1px solid var(--rule);border-radius:20px;overflow:hidden}
.mlist li + li{border-top:1px solid var(--rule)}
.mlist button{width:100%;display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;border:none;background:none;text-align:left;padding:14px 16px}
.m-date{font-size:12.5px;color:var(--ink3);font-weight:600}
.m-form{display:block;font-size:12px;font-weight:700;color:var(--indigo)}
.m-q{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14.5px;line-height:1.45}
.m-score{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--pine-d);letter-spacing:-1px}
.m-score small{font-family:var(--sans);font-size:12px;color:var(--ink3);font-weight:600;letter-spacing:0}
.total{display:flex;align-items:center;gap:16px;margin:4px 0 16px}
.total .n{font-family:var(--serif);font-size:56px;font-weight:700;letter-spacing:-2px;color:var(--pine-d);line-height:1}
.total .n small{font-family:var(--sans);font-size:17px;color:var(--ink3);font-weight:600;letter-spacing:0}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:20px;padding:14px 16px;margin-bottom:14px}
.card.flat{background:transparent}.card.tint{background:var(--pine-tint);border-color:#CFE3D6}
.scale{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;padding:8px 0;font-size:14px}
.scale b{font-weight:600}.scale em{font-style:normal;font-weight:700;font-size:13px;text-align:right;color:var(--pine-d)}
button.scale{width:100%;background:none;border:none;border-radius:12px;padding:10px 8px;text-align:left}
button.scale[aria-pressed="true"]{background:var(--pine-tint)}
.sq{display:block;font-weight:500;font-size:12px;color:var(--ink3)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;flex:1}
.seg i{display:block;height:6px;border-radius:3px;background:var(--seg)}
.seg i.on{background:var(--pine)}.seg.o i.on{background:var(--ember)}
.why{margin-top:10px;background:var(--pine-tint);border-radius:14px;padding:12px 14px;font-size:14.5px}
.quote{background:#fff;border-left:3px solid var(--ember);border-radius:8px;padding:9px 12px;font-size:14.5px}
.quote span{display:block;font-size:12px;font-weight:700;color:var(--ember)}
mark{background:var(--hi);border-radius:4px;padding:0 2px;color:inherit}

/* 다섯저울 설명 */
.dots{display:flex;gap:6px;overflow-x:auto;margin:0 0 18px;padding-bottom:2px}
.dots button{flex:none;border:1px solid var(--rule2);background:var(--surface);border-radius:999px;height:38px;padding:0 14px;font-weight:600;font-size:14px;color:var(--ink2)}
.dots button[aria-selected="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
.explain.s .sname{font-family:var(--serif);font-size:30px;margin:0}
.q-line{margin:2px 0 0;font-size:17px;color:var(--ink2)}
.beam{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:18px 0 6px;color:var(--pine)}
.beam .pan{background:var(--pine-tint);border:1px solid #CFE3D6;border-radius:12px;padding:10px 8px;text-align:center;font-size:14px;font-weight:700;color:var(--pine-d)}
.ba{display:grid;gap:8px;padding:12px 0 0}
.ba div{border-radius:12px;padding:11px 13px;font-size:14.5px;line-height:1.55}
.ba em{display:block;font-style:normal;font-size:12px;font-weight:700;margin-bottom:2px}
.ba .b{background:var(--ember-soft)}.ba .b em{color:var(--ember)}
.ba .g{background:var(--pine-tint)}.ba .g em{color:var(--pine-d)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}

/* 경험카드 */
.clist{list-style:none;padding:0;margin:0;background:var(--surface);border:1px solid var(--rule);border-radius:20px;overflow:hidden}
.clist li + li{border-top:1px solid var(--rule)}
.clist button{width:100%;border:none;background:none;text-align:left;padding:14px 16px;display:block}
.clist b{display:block;font-size:15.5px}.clist span{display:block;font-size:13.5px;color:var(--ink2);margin-top:2px}
.clist .warn{display:inline-block;font-style:normal;font-size:12px;font-weight:700;color:var(--ember);margin-top:4px}
.clist.sample{background:var(--pine-tint);border-color:#D3E6DA}
.xcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:14px;margin-bottom:8px}
.xcard .t{font-weight:700}

/* empty / misc */
.empty{text-align:center;padding:26px 10px}.empty img{width:110px}.empty h2{margin:8px 0 4px}.empty p{color:var(--ink2);font-size:14.5px;margin:0 0 18px}
.tip{display:flex;gap:12px;align-items:flex-end;background:var(--pine-tint);border-radius:16px;padding:12px 14px;margin-bottom:16px;font-size:14px}
.tip p{margin:0 0 4px}.char-sm{width:58px;height:auto;flex:none}
.chunk{display:block;width:100%;text-align:left;border:1px solid var(--rule2);background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;font-size:14.5px;line-height:1.5}
.chunk.sel{border:2px solid var(--indigo);background:var(--indigo-tint)}
.chart{display:flex;align-items:flex-end;gap:5px;height:140px;border-bottom:1px solid var(--rule)}
.chart button{flex:1;border:none;background:none;padding:0;height:100%;display:flex;align-items:flex-end;justify-content:center}
.chart button i{display:block;width:100%;max-width:20px;border-radius:4px 4px 0 0;background:var(--pine)}
.chart button.rest i{height:6px!important;width:6px;border-radius:50%;background:var(--rule2)}
.chart button.sel i{background:var(--pine-d)}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-family:var(--serif);font-size:26px;letter-spacing:-.5px}.stat span{font-size:12.5px;color:var(--ink2)}
.field{margin-bottom:14px}.field label{display:flex;gap:6px;align-items:baseline;font-weight:600;font-size:14px;margin-bottom:4px}.field label small{font-weight:500;color:var(--ink3);font-size:12px}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qchips button{border:1px solid var(--rule2);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px}
.qchips button[aria-pressed="true"]{background:var(--pine-soft);border-color:var(--pine);color:var(--pine-d);font-weight:600}
pre.prompt{white-space:pre-wrap;background:#fff;border:1px solid var(--rule2);border-radius:12px;padding:12px;font-size:12.5px;max-height:180px;overflow:auto;margin:6px 0 8px;font-family:inherit}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex:none;border:1px solid var(--rule2);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink2)}
.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.who-list{display:grid;gap:8px;margin:12px 0 10px}
.who-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--rule);border-radius:16px;padding:13px 14px;min-height:62px}
.who-item b{display:block;font-size:16px}.who-item small{display:block;color:var(--ink2);font-size:13px}
.who-item span:first-child{flex:1}.who-item .go{color:var(--ink3);font-size:22px}
.who-item[aria-pressed="true"]{border-color:var(--pine);background:var(--pine-tint)}

/* sheet & toast & nav */
.scrim{position:fixed;inset:0;background:rgba(20,26,22,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:calc(520px / var(--z, 1));max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 20px calc(26px + env(safe-area-inset-bottom));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--rule2);margin:0 auto 14px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;border-radius:16px;padding:8px 16px 8px 8px;display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:0 12px 28px rgba(0,0,0,.22);max-width:92vw;animation:pop .35s}
.toast img{width:38px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .in{max-width:calc(520px / var(--z, 1));margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.bottom a{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;min-height:58px;text-decoration:none;color:var(--ink3);font-size:12px;font-weight:600;white-space:nowrap}
nav.bottom a svg{width:22px;height:22px}
nav.bottom a.on{color:var(--ink)}
nav.bottom a.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--pine)}
nav.bottom a[href="#forms"].on::before{background:var(--indigo)}
.bob{animation:bob 2.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.wrap{padding:0 16px 120px}header.top{margin:0 -16px;padding-left:16px;padding-right:16px}.who-select{max-width:160px}.irow-body{padding-left:16px}.hero{grid-template-columns:1fr 76px}.hero-char{width:76px}}

/* ===== v3: 삼지작법 identity, flow stepper ===== */
[data-form="CRIB"]{--fc:#0E7490;--fc-d:#0B5A70;--fs:#E0F2F6;--ft:#F2FAFC}
[data-form="PREP"]{--fc:#3B4FB8;--fc-d:#2D3D93;--fs:#E7EAFA;--ft:#F4F5FD}
[data-form="AHWA"]{--fc:#8B3FB5;--fc-d:#6E2F92;--fs:#F2E8F8;--ft:#FAF5FC}
body[data-route="home"] .brand{display:none}
body[data-route="home"] header.top{padding-top:16px}
.who-line{margin:2px 0 0;font-size:13.5px;font-weight:600;color:var(--pine-d)}
body[data-route="home"] .who-line{margin:0}
.display{font-size:clamp(46px,14vw,60px);line-height:1.02;letter-spacing:-2px}
.slogan{margin:14px 0 0;font-size:16px;line-height:1.55;color:var(--ink2);font-weight:500}
.hero{padding:22px 0 26px;grid-template-columns:1fr 104px}.hero-char{width:104px}
.ftag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 11px 3px 7px;background:var(--fs);color:var(--fc-d);font-weight:700;font-size:13.5px;white-space:nowrap;vertical-align:middle}
.ftag .fi svg{width:16px;height:16px;display:block}
.ftag.sm{font-size:12.5px;padding:2px 9px 2px 6px}.ftag.sm .fi svg{width:14px;height:14px}
.ftag.lg{font-size:17px;padding:6px 14px 6px 10px}.ftag.lg .fi svg{width:20px;height:20px}
/* stepper */
.stepper{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0;margin:18px 0 16px}
.stepper a{display:flex;align-items:center;gap:8px;text-decoration:none;padding:8px 10px;border-radius:14px;background:#EAEDE7;color:var(--ink3);min-height:52px}
.stepper .no{flex:none;width:24px;height:24px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700}
.stepper .lb b{display:block;font-size:14px;line-height:1.2}.stepper .lb small{display:block;font-size:11px;line-height:1.25}
.stepper li.done a{background:var(--pine-tint);color:var(--pine-d)}.stepper li.done .no{background:var(--pine);color:#fff}
.stepper li.cur a{background:var(--ink);color:#fff}.stepper li.cur .no{background:#fff;color:var(--ink)}
@media (max-width:440px){.stepper .lb small{display:none}.stepper a{justify-content:center}}
.qbox .who{font-size:12.5px}
.qbox .q{font-family:var(--serif);font-size:21px;font-weight:700}
h2.ask{font-size:17px;margin:22px 0 12px}
/* 삼지작법 tiles */
.ftiles{display:grid;gap:12px}
.ftile{background:var(--surface);border:1.5px solid var(--rule);border-radius:22px;overflow:hidden;scroll-margin-top:80px;position:relative}
.ftile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--fc)}
.ftile.open{border-color:var(--fc);box-shadow:0 14px 30px -18px var(--fc)}
.ftile-btn{width:100%;display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start;border:none;background:none;text-align:left;padding:18px 18px 16px 22px}
.fi.big{width:52px;height:52px;border-radius:16px;background:var(--fs);color:var(--fc);display:flex;align-items:center;justify-content:center}
.fi.big svg{width:28px;height:28px}
.ftile.open .fi.big{background:var(--fc);color:#fff}
.fname{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:-.6px;color:var(--fc-d);line-height:1.2}
.fcrit{display:block;font-size:15px;font-weight:600;margin-top:4px}
.fex{display:block;font-size:13px;color:var(--ink3);margin-top:1px}
.fkeys{grid-column:2;display:flex;gap:5px;margin-top:2px}
.fkeys i{font-style:normal;width:26px;height:26px;border-radius:8px;background:var(--fs);color:var(--fc-d);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.reco{font-family:var(--sans);font-style:normal;font-size:11.5px;font-weight:700;color:#fff;background:var(--fc);border-radius:999px;padding:2px 9px;letter-spacing:0}
.ftile-body{padding:4px 18px 20px 22px;animation:up .22s ease-out}
.ftile-body .why{margin:0 0 18px;font-size:15px;color:var(--ink2);line-height:1.7}
.ftile .steps4{border-left-color:var(--fs)}
.ftile .steps4 .k{background:var(--fc)}
.ftile .steps4 q{background:var(--ft);color:var(--fc-d)}
.memo{display:flex;align-items:center;gap:8px;margin-top:8px}
.memo span{flex:none;font-size:12.5px;font-weight:700;color:var(--ink2)}
.memo input{min-height:40px!important;font-size:14px!important;border-style:dashed!important}
.btn.fbtn{background:var(--fc);margin-top:14px}.btn.fbtn:hover{background:var(--fc-d)}
/* 말하기 pad */
.speakpad{background:var(--surface);border:1.5px solid var(--fc);border-radius:22px;padding:16px 18px 18px;margin-top:4px}
.pad-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.speakpad .direction{background:var(--ft);color:var(--fc-d)}
.speakpad .slot .k{background:var(--fs);color:var(--fc-d)}
.memo-line{font-size:13px;color:var(--fc-d);background:var(--ft);border-radius:8px;padding:4px 9px;margin-top:4px;display:inline-block}
.speakpad .est .bar i{background:var(--fc)}
textarea:focus,input:focus{outline-color:var(--ink)}
/* 재기 result */
.result{background:var(--surface);border:1px solid var(--rule);border-radius:22px;padding:16px 16px 14px;margin-bottom:12px}
.r-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.r-date{font-size:12.5px;color:var(--ink3);font-weight:600}
.r-q{font-family:var(--serif);font-size:18px;font-weight:700;line-height:1.45;margin:10px 0 4px}
.result .total img{width:76px}
.result .grade{font-weight:800;color:var(--pine-d);font-size:16px;margin:2px 0 2px}
.result .split{display:flex;gap:8px;align-items:baseline;justify-content:center;background:var(--pt-tint,#EEF6F0);border-radius:12px;padding:9px 12px;margin:-6px 0 14px;font-size:13.5px;color:var(--ink2)}
.result .split b{font-size:18px;color:var(--ink)}
.result .better{border:1.5px solid var(--fc);background:var(--fs);border-radius:14px;padding:12px 14px;margin:0 0 14px}
.result .better p{margin:0 0 10px;font-size:14px;line-height:1.55;color:var(--ink)}
.result .better .btn{width:100%;border-color:var(--fc);color:var(--fc)}
.result .r-sub{display:flex;justify-content:space-between;align-items:baseline;font-size:15.5px;margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--rule)}
.result .r-sub span{font-size:14px;color:var(--pine-d);font-weight:800}
.result ul.base{list-style:none;margin:0;padding:0}
.result ul.base li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--rule)}
.result ul.base li:last-child{border-bottom:0}
.result ul.base .k{width:26px;height:26px;border-radius:50%;background:#FBE3D0;color:#9A4A12;font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.result ul.base li.ok .k{background:#DDEFE3;color:#14503A}
.result ul.base .t b{display:block;font-size:14px}
.result ul.base .t small{display:block;font-size:12.5px;color:var(--ink3);line-height:1.45;margin-top:2px}
.result ul.base em{font-style:normal;font-weight:800;font-size:15px;color:var(--ink)}
.result ul.base em small,.result .scale em small{font-size:11.5px;color:var(--ink3);font-weight:600}
.result .rbox{border-radius:16px;padding:4px 14px 12px;margin:14px 0 0}
.result .rbox .r-sub{border-top:0;padding-top:10px;margin-top:4px}
.result .rb-s{background:#EAF5EE;border:1px solid #CFE7D7}
.result .rb-s .r-sub,.result .rb-s .r-sub span{color:#14503A}
.result .rb-s .scale[aria-pressed="true"]{background:#fff}
.result .rb-s .why{background:#fff}
.result .rb-b{background:#EEF0F6;border:1px solid #D9DDEA}
.result .rb-b .r-sub,.result .rb-b .r-sub span{color:#2E3A5C}
.result .rb-b ul.base li{border-bottom-color:#D9DDEA}
.result .split .sp-s b{color:#14503A}.result .split .sp-b b{color:#2E3A5C}
.scale .sq .fixline{display:block;width:max-content;font-style:normal;font-size:11px;font-weight:800;color:#B3261E;border:1px solid #E7A9A4;background:#fff;border-radius:999px;padding:1px 7px;margin:3px 0 3px}
.scale .wt.fix{background:#fff;color:#B3261E;border:1px solid #E7A9A4}
.result .perfect{margin:14px 0 0;border:1px solid #E6D9A8;background:#FFF9E6;border-radius:16px;padding:0 14px}
.result .perfect summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 0;font-weight:800;font-size:15px;color:#6B5310}
.result .perfect summary::-webkit-details-marker{display:none}
.result .perfect summary::after{content:"+";font-size:20px;font-weight:600;margin-left:auto}
.result .perfect[open] summary::after{content:"−"}
.result .perfect summary small{font-weight:600;font-size:12px;color:#8A7438}
.result .perfect .pf-note{margin:0 0 10px;font-size:13px;color:var(--ink2);line-height:1.55}
.result .perfect ol.pf{list-style:none;margin:0 0 12px;padding:0}
.result .perfect ol.pf li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:9px 0;border-top:1px dashed #E6D9A8}
.result .perfect .k{width:26px;height:26px;border-radius:50%;background:#F5E7B5;color:#6B5310;font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.result .perfect b{font-size:13px;color:#6B5310}.result .perfect li p{margin:2px 0 0;font-size:14px;line-height:1.55;color:var(--ink)}
.scale .wt{font-style:normal;font-size:10.5px;font-weight:800;margin-left:6px;padding:1px 6px;border-radius:999px;vertical-align:2px}
.scale .wt-10{background:var(--pine-d);color:#fff}.scale .wt-6{background:#DDEFE3;color:#14503A}.scale .wt-2{background:#ECEDE8;color:var(--ink3)}
.actions{margin-top:4px}
.textbtn.center{display:block;margin:10px auto 0}
.m-form{color:var(--fc)!important}
.mlist button.cur{background:var(--pine-tint)}
.irow-body .ftag{margin:2px 2px}

/* ===== v4: brand, page themes, compact 삼지작법 ===== */
:root{--ember:#C62828;--ember-soft:#FDECEC;--pt:var(--pine);--pt-d:var(--pine-d);--pt-soft:var(--pine-soft);--pt-tint:var(--pine-tint)}
body[data-route="forms"],body[data-route="drill"],[data-step="forms"]{--pt:#3F3CBB;--pt-d:#2F2C99;--pt-soft:#E8E7FA;--pt-tint:#F4F4FD}
body[data-route="speak"],[data-step="speak"]{--pt:#C2560E;--pt-d:#9E4509;--pt-soft:#FCEBDD;--pt-tint:#FEF6EF}
body[data-route="scales"],body[data-route="feedback"],body[data-route="scaleinfo"],body[data-route="report"],[data-step="scales"]{--pt:#1D6A47;--pt-d:#14503A;--pt-soft:#E2F0E7;--pt-tint:#F1F7F3}
[data-form="CRIB"]{--fc:#0E7490;--fc-d:#0B5A70;--fs:#E0F2F6;--ft:#F2FAFC}
[data-form="PREP"]{--fc:#2563EB;--fc-d:#1D4FBD;--fs:#E4ECFD;--ft:#F3F7FE}
[data-form="AHWA"]{--fc:#BE185D;--fc-d:#99134B;--fs:#FBE6EF;--ft:#FDF4F8}
.btn{background:var(--pt)}.btn:hover{background:var(--pt-d)}
.btn.ghost{background:#fff;color:var(--pt-d);border-color:color-mix(in srgb,var(--pt) 55%,#fff);border-width:1.5px;box-shadow:0 1px 2px rgba(27,38,32,.06)}
.btn.ghost:hover{border-color:var(--pt);background:color-mix(in srgb,var(--pt) 6%,#fff)}
.btn.cta{background:var(--pine);box-shadow:0 10px 24px -10px rgba(29,106,71,.6)}
.textbtn,.link{color:var(--pt-d)}.textlink{color:var(--pt-d)}
nav.bottom a.on::before{background:var(--pt)}
/* brand */
.brand{display:inline-flex!important;align-items:center;gap:7px;font-family:var(--sans)!important;font-weight:800!important;font-size:17px!important;letter-spacing:1.5px!important;color:var(--ink)}
.brand svg{color:var(--pine)}
body[data-route="home"] .brand{display:inline-flex!important}
.who-line{margin:3px 0 0 27px}
/* stepper colors per step */
.stepper li.cur a{background:var(--pt);color:#fff}.stepper li.cur .no{background:#fff;color:var(--pt-d)}
.stepper li.done a{background:var(--pt-tint);color:var(--pt-d)}.stepper li.done .no{background:var(--pt);color:#fff}
/* sticky question */
.qbox.sticky{position:sticky;top:74px;z-index:15;box-shadow:0 8px 20px -14px rgba(0,0,0,.35)}
.qbox.sticky .q{font-size:18px}
/* page head with character */
.ph-row{display:grid;grid-template-columns:1fr auto;align-items:end;gap:10px}
.ph-char{width:76px;margin-bottom:12px}
.ph-hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:22px;margin-bottom:16px}.ph-hero .ph-char{width:110px;margin:0}.ph-hero h1.ph{margin:8px 0 4px}.ph-hero .sub{max-width:30em;margin:0 auto}
.ask-row{display:grid;grid-template-columns:1fr 60px;align-items:end;gap:8px;margin:18px 0 10px}
.ask-row h2.ask{margin:0 0 6px}.ask-char{width:60px}
.ask-row{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0;margin:10px 0 14px;padding-top:12px}
.ask-row .ask-char{width:110px}.ask-row h2.ask{margin:8px 0 0;font-size:20px}
.fi.big{background:none!important;width:52px;height:52px}.fi.big svg.fgrid{width:52px;height:52px}
.fgrid .t{fill:var(--fs)}.fgrid .l{fill:var(--fc-d,var(--fc));font:800 12.5px/1 var(--sans,system-ui),sans-serif}
.ftile.open .fgrid .t{fill:var(--fc)}.ftile.open .fgrid .l{fill:#fff}
/* tiles compact */
.fcode{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.3px;color:var(--fc);background:var(--fs);border-radius:999px;padding:2px 8px}
.ftile-body .why{margin:0 0 14px;font-size:14.5px;line-height:1.65}
.rules{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:12px}
.rules li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.rules .k{width:30px;height:30px;border-radius:50%;background:var(--fc);color:#fff;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center}
.r-top{margin:4px 0 2px;font-size:14.5px;line-height:1.45}.r-top b{color:var(--fc-d);margin-right:4px}
.r-ex{margin:0 0 6px;font-size:13.5px;color:var(--ink2);line-height:1.5}
.memo-in{min-height:38px!important;font-size:14px!important;padding:7px 10px!important;border-style:dashed!important;background:var(--ft)!important}
details.more{border-top:1px solid var(--rule);padding:10px 0}
details.more summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--fc-d);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:" +";}
details.more[open] summary::after{content:" −"}
details.more ul{margin:8px 0 0;padding-left:18px;font-size:14px;line-height:1.6;color:var(--ink2)}
details.more p{margin:8px 0 0;font-size:14px;line-height:1.65;color:var(--ink2)}
.ftile-body .mistake{margin-top:8px;font-size:13.5px}
.ref{margin:10px 0 0;font-size:12.5px;color:var(--ink3)}
.btn.fbtn,.btn.fbtn:hover{background:var(--pt)}
.hero .slogan{grid-column:1 / -1;margin-top:6px}
.hero .motto{grid-column:1 / -1;margin-top:10px}
/* brandbox in 재기 */
.brandbox{display:flex;gap:12px;align-items:flex-start;background:var(--pt-tint);border:1px solid var(--pt-soft);border-radius:18px;padding:14px;margin-bottom:14px}
.b-ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--pine);color:#fff;display:flex;align-items:center;justify-content:center}
.b-ic svg{width:22px;height:22px}
.brandbox b{font-size:15px;letter-spacing:.3px}.brandbox p{margin:3px 0 0;font-size:13.5px;line-height:1.6;color:var(--ink2)}
.brandbox a{color:var(--pine-d);font-weight:600}
.speakpad{border-color:var(--pt-soft);border-width:2px}
.refbox{margin-top:12px;background:var(--ft);border-radius:14px;padding:12px 14px}.refbox .ref{margin:0 0 6px}.refbox b{display:block;font-size:14px;color:var(--fc-d)}.refbox p{margin:4px 0 0;font-size:13.5px;line-height:1.65;color:var(--ink2)}
.btn.tospeak,.btn.tospeak:hover{background:#FCE3CF;color:#8A3C07;border:1.5px solid #F6C9A6;margin-top:14px}
.btn.tospeak:hover{background:#FAD6BA}
/* 홈 줄 이름표: 진한 초록에서 연한 초록으로 */
.irow.who .tag{background:#8E1B1B;color:#fff}
.irow[data-k="why"] .tag{background:#11663D;color:#fff}
.irow[data-k="what"] .tag{background:#2E8B57;color:#fff}
.irow[data-k="use"] .tag{background:#9ED8B0;color:#0B4A2A}
.who-line .chg{margin-left:8px;font-size:12.5px;font-weight:600;color:var(--ink3);text-decoration:underline;text-underline-offset:3px}
.cta-dock .btn.guide-btn{display:flex;align-items:center;justify-content:center;gap:10px}
.guide-btn .pl{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.btn.quick{display:block;width:100%;margin-top:8px;background:transparent;color:var(--pine-d);border:1.5px solid var(--pine-soft);font-size:15px;min-height:48px}
.btn.quick:hover{background:var(--pine-tint)}
/* 글자 확대에도 깨지지 않게 */
.display,.g-h,.motto,.slogan,.irow-t,.gl,.btn{overflow-wrap:anywhere;word-break:keep-all}
.g-flow{flex-wrap:wrap}.g-flow li{min-width:0}
.guide-pair .btn{min-width:0}
/* guide */
.guide{--gc:#1D6A47;position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;flex-direction:column;max-width:calc(520px / var(--z, 1));margin:0 auto;overflow:hidden}
.guide::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 50% 0%,color-mix(in srgb,var(--gc) 14%,transparent),transparent 70%);transition:background .5s;pointer-events:none}
.g-top{position:relative;z-index:3;padding:calc(12px + env(safe-area-inset-top)) 16px 0}
.g-bars-top{display:flex;gap:4px}
.g-bars-top span{flex:1;height:3px;border-radius:2px;background:rgba(27,38,32,.14);overflow:hidden}
.g-bars-top span i{display:block;height:100%;width:0;background:var(--gc)}
.g-bars-top span.done i{width:100%}
.g-bars-top span.cur i{animation:gfill linear forwards}
.guide.paused .g-bars-top span.cur i,.guide.paused .g-scene *{animation-play-state:paused!important}
@keyframes gfill{to{width:100%}}
.g-ctl{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:8px}
.g-count{font-size:12.5px;color:var(--ink3);margin-right:auto;font-weight:600}
.g-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:#fff;color:var(--ink);display:grid;place-items:center;position:relative;z-index:4}
.g-btn .ic-play{display:none}.g-btn.snd .ic-on{display:none}.guide.listen .g-btn.snd .ic-on{display:block}.guide.listen .g-btn.snd .ic-off{display:none}.guide.listen .g-btn.snd{background:var(--gc);color:#fff;border-color:var(--gc)}
.guide-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.guide-pair .btn{min-height:62px;padding:8px 14px;justify-content:flex-start;gap:10px;border-radius:18px}.guide-pair .pl{flex:none;width:30px;height:30px}.gl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;text-align:left}.gl small{font-size:12px;font-weight:600;opacity:.85}.gl b{font-size:16.5px;font-weight:800}
.btn.guide-btn.alt{background:#fff;color:var(--pine-d);border:1.5px solid var(--pine)}.btn.guide-btn.alt .pl{background:var(--pine-soft)}.guide.paused .g-btn .ic-play{display:block}.guide.paused .g-btn .ic-pause{display:none}
.g-stage{pointer-events:none;position:relative;z-index:2;flex:1;overflow:auto;padding:8px 26px calc(30px + env(safe-area-inset-bottom))}
.g-tap{position:absolute;top:90px;bottom:0;width:30%;z-index:1;border:none;background:transparent}
.g-tap.prev{left:0}.g-tap.next{right:0}
.g-scene{position:relative;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px;pointer-events:none}
.g-scene button,.g-scene a{pointer-events:auto}
.g-scene>*,.g-flow li,.g-chips .g-chip,.g-forms .g-form,.g-slots li,.g-bars li,.g-stack span{opacity:0;animation:gin .55s cubic-bezier(.2,.8,.2,1) var(--d,0s) forwards}
.g-scene>.g-kicker{--d:0s}.g-scene>.g-h,.g-scene>.g-big{--d:.15s}
.g-scene>.g-fcards,.g-scene>.g-flow,.g-scene>.g-chips,.g-scene>.g-forms,.g-scene>.g-slots,.g-scene>.g-bars,.g-scene>.g-stack{animation:none;opacity:1}
@keyframes gin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.g-kicker{margin:0;font-size:13px;font-weight:700;color:var(--gc);letter-spacing:.2px}
.g-big{margin:0;font-family:'Do Hyeon',var(--sans,sans-serif);font-weight:400;font-size:clamp(44px,15vw,64px);word-break:keep-all;overflow-wrap:anywhere;padding-right:110px;line-height:1;letter-spacing:-1px;color:var(--ink)}
.g-h{margin:0;font-size:40px;line-height:1.05;letter-spacing:-1px;font-weight:800;color:var(--gc)}
.g-cap{margin:0;font-size:16.5px;line-height:1.6;color:var(--ink2);max-width:30em}
.g-cap.sm{font-size:14.5px;color:var(--ink3)}
.g-char{position:absolute;right:-6px;top:4px;width:120px;animation:gin .6s .2s forwards,bob 2.8s 1s ease-in-out infinite!important}
.g-char.sm{top:auto;bottom:0;width:86px}
.g-jump{top:0}
.g-flow{display:flex;gap:8px;list-style:none;margin:6px 0 0;padding:0}
.g-flow li{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--rule);border-radius:14px;padding:12px;font-weight:700;font-size:15px}
.g-flow li b{flex:none;width:1.75em;height:1.75em;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.85em;line-height:1}
.g-flow li:nth-child(1) b{background:#3F3CBB}.g-flow li:nth-child(2) b{background:#C2560E}.g-flow li:nth-child(3) b{background:#1D6A47}
.g-chips{display:flex;flex-wrap:wrap;gap:8px;padding-right:70px}
.g-chip{padding:10px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--rule);font-weight:600;font-size:15px}
.g-chips .g-chip{animation:gin .55s cubic-bezier(.2,.8,.2,1) var(--d) forwards,ghl .8s ease-in-out var(--h)}
.g-chips .g-chip.final{animation:gin .55s cubic-bezier(.2,.8,.2,1) var(--d) forwards,ghl .8s ease-in-out var(--h),gfinal .4s ease 5.8s forwards}
@keyframes gfinal{to{background:var(--gc);border-color:var(--gc);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--gc) 18%,transparent)}}
@keyframes ghl{18%,82%{background:var(--gc);border-color:var(--gc);color:#fff;transform:scale(1.07);box-shadow:0 0 0 4px color-mix(in srgb,var(--gc) 18%,transparent)}}
.g-chip.on{background:var(--gc);border-color:var(--gc);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--gc) 18%,transparent)}
.g-q{background:#fff;border:1.5px solid color-mix(in srgb,var(--gc) 35%,transparent);border-radius:16px;padding:12px 14px;font-weight:700;font-size:16.5px;line-height:1.45}
.g-q small{display:block;font-size:12px;font-weight:600;color:var(--ink3);margin-bottom:2px}
.g-forms{display:flex;gap:6px}
.g-fcards{display:grid;gap:8px}
.g-fcard{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1.5px solid var(--rule);border-left:5px solid var(--fc);border-radius:14px;padding:10px 12px;opacity:0;animation:gin .55s cubic-bezier(.2,.8,.2,1) var(--d) forwards}
.g-fcard.pick{animation:gin .55s cubic-bezier(.2,.8,.2,1) var(--d) forwards,gpickc .6s var(--pk,2.9s) forwards}
@keyframes gpickc{to{border-color:var(--fc);box-shadow:0 0 0 3px color-mix(in srgb,var(--fc) 22%,transparent)}}
.g-fgrid{flex:none;width:2.6em;height:2.6em}.g-fgrid svg{width:100%;height:100%}
.g-fbody{min-width:0;display:grid;gap:3px}
.g-fbody b{font-size:1.02em;color:var(--fc);display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.g-fbody b small{font-size:.72em;color:var(--ink3);font-weight:600}
.g-fbody b em{font-style:normal;font-size:.7em;color:#fff;background:var(--fc);border-radius:999px;padding:1px 8px;opacity:0;animation:gin .4s var(--pk,2.9s) forwards}
.g-fwhen{font-size:.86em;color:var(--ink2)}
.g-fslots{display:flex;flex-wrap:wrap;gap:4px}
.g-fslots i{font-style:normal;font-size:.76em;font-weight:700;color:var(--fc);background:color-mix(in srgb,var(--fc) 10%,#fff);border-radius:6px;padding:2px 7px}
.g-form{flex:1;text-align:center;padding:9px 4px;border-radius:12px;background:#fff;border:1.5px solid var(--rule);font-weight:700;font-size:14px;color:var(--ink3)}
.g-form small{display:block;font-size:11px;font-weight:600;opacity:.8}
.g-form.pick{background:var(--fc);border-color:var(--fc);color:#fff;animation:gin .55s var(--d) forwards,gpick .5s calc(var(--d) + .9s) both}
@keyframes gpick{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.g-slots{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.g-slots li{display:flex;gap:10px;align-items:baseline;background:#fff;border-left:4px solid var(--fc);border-radius:10px;padding:9px 12px;font-size:14px;line-height:1.4}
.g-slots li b{flex:none;width:52px;color:var(--fc);font-size:13px}
.g-slots li span{color:var(--ink2)}
.g-mic{position:relative;margin-left:14px!important;width:84px;height:84px;border-radius:50%;background:var(--gc);display:grid;place-items:center;margin:6px 0}
.g-ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--gc);animation:gring 1.6s ease-out infinite}
@keyframes gring{from{transform:scale(1);opacity:.7}to{transform:scale(1.7);opacity:0}}
.g-timer{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;color:var(--gc)}
.g-timer i{flex:1;height:8px;border-radius:4px;background:color-mix(in srgb,var(--gc) 16%,transparent);position:relative;overflow:hidden}
.g-timer i::after{content:"";position:absolute;inset:0;width:0;background:var(--gc);animation:gfill 6.5s 1s linear forwards}
.g-type{margin:0;font-size:18px;font-weight:600;line-height:1.5;color:var(--ink);background:#fff;border-radius:14px;padding:12px 14px;border:1px solid var(--rule);clip-path:inset(0 100% 0 0);animation:gin .1s var(--d) forwards,gtype 3s calc(var(--d) + .1s) steps(28) forwards!important}
@keyframes gtype{to{clip-path:inset(0 0 0 0)}}
.g-bars{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.g-bars li{display:grid;grid-template-columns:5.2em 1fr 1.3em;align-items:center;gap:10px;font-size:14.5px}
.g-bars li b{font-weight:700}
.g-bars li i{height:10px;border-radius:5px;background:rgba(27,38,32,.08);overflow:hidden}
.g-bars li em{display:block;height:100%;width:0;border-radius:5px;background:var(--gc);animation:gbar .8s calc(var(--d) + .3s) ease-out forwards}
.g-bars li.weak em{background:var(--ember)}.g-bars li.weak b,.g-bars li.weak span{color:var(--ember)}
.g-bars li span{font-weight:700;text-align:right}
@keyframes gbar{to{width:calc(var(--v) * 100%)}}
.g-total{margin:0;font-size:20px;color:var(--ink2)}.g-total b{font-size:44px;color:var(--gc);letter-spacing:-1px}.g-total small{font-size:12.5px;color:var(--ink3);margin-left:6px}
.g-stack{position:relative;height:120px;margin:4px 0}
.g-stack span{position:absolute;left:0;width:72%;height:84px;border-radius:16px;background:#fff;border:1.5px solid var(--rule);padding:12px 14px;font-weight:700;font-size:14px;color:var(--gc);box-shadow:0 6px 18px rgba(27,38,32,.08)}
.g-stack span:nth-child(1){top:0;transform:rotate(-4deg)}.g-stack span:nth-child(2){top:14px;left:6%;transform:rotate(2deg)}.g-stack span:nth-child(3){top:28px;left:12%}
.g-stack span{animation-name:gin}.g-stack b{display:block;font-size:15px}.g-stack small{display:block;margin-top:6px;font-size:12.5px;color:var(--ink3);font-weight:500}
.g-end{display:grid;gap:8px;margin-top:6px;padding-right:80px}
.g-end .btn{width:100%;min-height:52px}
.g-end .btn.ghost{color:var(--gc);border:1.5px solid color-mix(in srgb,var(--gc) 30%,transparent);background:transparent}
.g-end .btn.cta{background:var(--gc)}
@media (prefers-reduced-motion:reduce){.guide *{animation-duration:.01s!important;animation-delay:0s!important}.g-ring{display:none}}
.tagline{margin:-6px 0 0 34px;line-height:1.15;font-size:13.5px;font-weight:700;color:#8E1B1B;white-space:nowrap;letter-spacing:-.2px}
.slist{list-style:none;padding:0;display:grid;gap:2px;line-height:1.45}
.slist li{position:relative;padding-left:16px}
.slist li::before{content:"";position:absolute;left:3px;top:.62em;width:5px;height:5px;border-radius:50%;background:currentColor}
.hdr-r{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hdr-r .who-line{margin:0!important;font-size:12.5px;font-weight:700;white-space:nowrap;text-align:right;color:#8E1B1B}
.hdr-r .who-line a.need{color:#8E1B1B;text-decoration:underline;text-underline-offset:3px}
@media (max-width:380px){.tagline{font-size:12px;margin-left:0}}
@media (min-width:381px) and (max-width:420px){.tagline{font-size:12.5px;margin-left:28px}}
.who-line a{color:inherit;text-decoration:none}.who-line u{text-underline-offset:3px}

/* ===== v5: 단계 색(연장미·연하늘·연초록), 삼지작법 단일 색, 새 네 글자 아이콘 ===== */
body[data-route="forms"],body[data-route="drill"],[data-step="forms"]{--pt:#F4B4C1;--pt-d:#A83E57;--pt-on:#7E2A3F;--pt-soft:#FBE3E8;--pt-tint:#FDF2F4}
body[data-route="speak"],[data-step="speak"]{--pt:#A9D6F2;--pt-d:#22689A;--pt-on:#164A70;--pt-soft:#E1F1FB;--pt-tint:#F2F9FD}
body[data-route="scales"],body[data-route="feedback"],body[data-route="scaleinfo"],body[data-route="report"],[data-step="scales"]{--pt:#AEDDBA;--pt-d:#1D6A47;--pt-on:#14503A;--pt-soft:#E2F3E7;--pt-tint:#F2FAF4}
body[data-route="forms"] .btn:not(.ghost):not(.tospeak),body[data-route="drill"] .btn:not(.ghost),body[data-route="speak"] .btn:not(.ghost),body[data-route="scales"] .btn:not(.ghost),body[data-route="feedback"] .btn:not(.ghost),body[data-route="scaleinfo"] .btn:not(.ghost),body[data-route="report"] .btn:not(.ghost){color:var(--pt-on)}
body[data-route="forms"] .btn:not(.ghost):hover,body[data-route="speak"] .btn:not(.ghost):hover,body[data-route="scales"] .btn:not(.ghost):hover,body[data-route="report"] .btn:not(.ghost):hover{background:color-mix(in srgb,var(--pt) 82%,var(--pt-d))}
.stepper li.cur a{background:var(--pt);color:var(--pt-on)}.stepper li.cur .no{background:#fff;color:var(--pt-on)}
.stepper li.done .no{background:var(--pt);color:var(--pt-on)}

   휴대폰은 지금 그대로. 넓은 화면에서는 왼쪽 세로 메뉴 + 화면별 두 단 배치 */

}

(function(){

    var root = document.documentElement, prev = root.style.zoom;

    root.style.zoom = nz < 1 ? nz.toFixed(3) : '';
